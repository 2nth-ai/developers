<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Luthuli Staff</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --ios-blue: #007aff;
  --ios-gray: #e5e5ea;
  --ios-header: #f7f7f7;
  --ios-border: #c6c6c8;
  --ios-text: #000;
  --ios-text-secondary: #8e8e93;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

html, body {
  height: 100vh; /* fallback */
  height: 100dvh;
  overflow: hidden;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: #000;
  -webkit-text-size-adjust: 100%;
}

#app {
  max-width: 480px;
  height: var(--app-height, 100vh);
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  background: #fff;
  position: fixed;
  inset: 0;
  overflow: hidden;
}

@media (min-width: 481px) {
  #app {
    position: relative;
    inset: auto;
    margin: 0 auto;
  }
}

/* ── HEADER ── */
.header {
  background: var(--ios-header);
  display: flex;
  align-items: center;
  padding: 8px 16px;
  padding-top: calc(8px + var(--safe-top));
  min-height: 56px;
  flex-shrink: 0;
  z-index: 10;
  border-bottom: 0.5px solid var(--ios-border);
}

.header-back {
  font-size: 17px;
  color: var(--ios-blue);
  cursor: pointer;
  flex-shrink: 0;
  min-width: 60px;
  display: flex;
  align-items: center;
  gap: 2px;
  -webkit-tap-highlight-color: transparent;
}

.header-back svg {
  width: 12px;
  height: 20px;
  fill: var(--ios-blue);
}

.header-center {
  flex: 1;
  text-align: center;
}

.header-title {
  font-size: 17px;
  font-weight: 600;
  color: var(--ios-text);
  line-height: 1.2;
}

.header-subtitle {
  font-size: 12px;
  color: var(--ios-text-secondary);
  line-height: 1.2;
}

.header-spacer {
  min-width: 60px;
  flex-shrink: 0;
}

/* ── MESSAGES ── */
.messages {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 12px 16px;
  -webkit-overflow-scrolling: touch;
  scroll-behavior: smooth;
}

.timestamp {
  text-align: center;
  font-size: 12px;
  color: var(--ios-text-secondary);
  margin: 16px 0 8px;
}

.bubble-row {
  display: flex;
  margin-bottom: 4px;
  animation: fadeUp 0.25s ease-out;
}

.bubble-row.agent { justify-content: flex-start; }
.bubble-row.user { justify-content: flex-end; }

.bubble {
  max-width: 75%;
  padding: 8px 14px;
  font-size: 16px;
  line-height: 1.4;
  word-wrap: break-word;
  position: relative;
}

.bubble-row.agent .bubble {
  background: var(--ios-gray);
  color: var(--ios-text);
  border-radius: 18px 18px 18px 6px;
}

.bubble-row.user .bubble {
  background: var(--ios-blue);
  color: #fff;
  border-radius: 18px 18px 6px 18px;
}

/* Typing indicator */
.typing-row {
  display: flex;
  justify-content: flex-start;
  margin-bottom: 4px;
}

.typing-bubble {
  background: var(--ios-gray);
  border-radius: 18px 18px 18px 6px;
  padding: 12px 18px;
  display: flex;
  align-items: center;
  gap: 4px;
}

.typing-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #8e8e93;
  animation: typingBounce 1.4s infinite;
}

.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-4px); opacity: 1; }
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ── SCHEDULE CARD ── */
.schedule-card {
  background: #f9f9f9;
  border-radius: 12px;
  padding: 10px;
  margin-top: 6px;
}

.schedule-card-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--ios-text-secondary);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

.schedule-strip {
  display: flex;
  gap: 4px;
}

.schedule-day {
  flex: 1;
  text-align: center;
  border-radius: 8px;
  padding: 6px 2px;
  min-width: 0;
}

.schedule-day-label {
  font-size: 10px;
  font-weight: 600;
  color: #666;
  text-transform: uppercase;
}

.schedule-day-num {
  font-size: 15px;
  font-weight: 600;
  margin: 2px 0;
}

.schedule-day-status {
  font-size: 8px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

.schedule-day.work { background: #d4edda; }
.schedule-day.work .schedule-day-num { color: #1b5e20; }
.schedule-day.work .schedule-day-status { color: #2e7d32; }

.schedule-day.off { background: #eee; }
.schedule-day.off .schedule-day-num { color: #757575; }
.schedule-day.off .schedule-day-status { color: #999; }

.schedule-day.leave { background: #fff3e0; }
.schedule-day.leave .schedule-day-num { color: #e65100; }
.schedule-day.leave .schedule-day-status { color: #ef6c00; }

.schedule-day.sunday { background: #e3f2fd; }
.schedule-day.sunday .schedule-day-num { color: #1565c0; }
.schedule-day.sunday .schedule-day-status { color: #1976d2; }

/* ── BOOKING CARD ── */
.booking-card {
  background: #f9f9f9;
  border-radius: 12px;
  padding: 12px;
  margin-top: 6px;
}

.booking-card + .booking-card {
  margin-top: 8px;
}

.booking-guest {
  font-size: 15px;
  font-weight: 600;
  color: var(--ios-text);
}

.booking-detail {
  font-size: 13px;
  color: var(--ios-text-secondary);
  margin-top: 2px;
}

.booking-badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 10px;
  margin-top: 6px;
}

.booking-badge.checkin { background: #d4edda; color: #1b5e20; }
.booking-badge.checkout { background: #ffeaa7; color: #6c5b00; }

/* ── CONFIRM CARD ── */
.confirm-card {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #d4edda;
  border-radius: 12px;
  padding: 10px 14px;
  margin-top: 6px;
}

.confirm-icon {
  font-size: 20px;
  flex-shrink: 0;
}

.confirm-text {
  font-size: 14px;
  color: #1b5e20;
  font-weight: 500;
}

/* ── INPUT BAR ── */
.input-bar {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  padding: 8px 12px;
  padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  background: var(--ios-header);
  border-top: 0.5px solid var(--ios-border);
  flex-shrink: 0;
}

.input-field {
  flex: 1;
  border: 0.5px solid var(--ios-border);
  border-radius: 20px;
  padding: 8px 16px;
  font-size: 16px;
  font-family: inherit;
  background: #fff;
  outline: none;
  resize: none;
  max-height: 100px;
  line-height: 1.4;
  min-height: 36px;
}

.input-field:focus {
  border-color: #aaa;
}

.send-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--ios-blue);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  opacity: 0.3;
  pointer-events: none;
  transition: opacity 0.15s;
  -webkit-tap-highlight-color: transparent;
}

.send-btn.active {
  opacity: 1;
  pointer-events: auto;
}

.send-btn svg {
  width: 18px;
  height: 18px;
  fill: #fff;
  margin-left: 2px;
}

/* ── TOAST ── */
.toast {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: rgba(0,0,0,0.8);
  color: #fff;
  padding: 10px 20px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 500;
  z-index: 100;
  opacity: 0;
  transition: all 0.3s ease;
  pointer-events: none;
  max-width: 320px;
  text-align: center;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ── LEAVE FLOW ── */
.leave-actions {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}

.leave-btn {
  flex: 1;
  padding: 8px 12px;
  border-radius: 10px;
  border: none;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  -webkit-tap-highlight-color: transparent;
}

.leave-btn.confirm {
  background: var(--ios-blue);
  color: #fff;
}

.leave-btn.cancel {
  background: #e5e5ea;
  color: var(--ios-text);
}

/* ── SUGGESTION CHIPS ── */
.chips { display:flex; flex-wrap:wrap; gap:6px; padding:8px 16px; }
.chip { font-size:12px; padding:6px 14px; border-radius:16px; border:1px solid #007aff; background:transparent; color:#007aff; cursor:pointer; }
.chip:hover { background:rgba(0,122,255,.08); }

/* ── FEEDBACK ROW ── */
.feedback-row {
  display: flex;
  gap: 4px;
  margin-top: 2px;
  justify-content: flex-start;
}
.feedback-btn {
  background: none;
  border: none;
  font-size: 14px;
  cursor: pointer;
  opacity: 0.35;
  padding: 2px 4px;
  border-radius: 4px;
  transition: opacity 0.15s, background 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.feedback-btn:hover { opacity: 0.6; }
.feedback-btn.selected { opacity: 1; background: rgba(0,0,0,0.06); }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-back">
      <svg viewBox="0 0 12 20"><path d="M10 0L0 10l10 10 1.4-1.4L2.8 10 11.4 1.4z"/></svg>
      Back
    </div>
    <div class="header-center">
      <div class="header-title">Luthuli Staff</div>
      <div class="header-subtitle">Assistant</div>
    </div>
    <div class="header-actions" style="display:flex;gap:6px">
      <button onclick="clearStaffChat()" style="font-size:9px;color:#007aff;background:none;border:1px solid rgba(0,122,255,.2);border-radius:12px;padding:3px 10px;cursor:pointer">Clear</button>
      <button onclick="restartStaffChat()" style="font-size:9px;color:#007aff;background:none;border:1px solid rgba(0,122,255,.2);border-radius:12px;padding:3px 10px;cursor:pointer">Restart</button>
    </div>
  </div>

  <div class="messages" id="messages"></div>

  <div class="input-bar">
    <textarea class="input-field" id="input" rows="1" placeholder="Message"></textarea>
    <button class="send-btn" id="sendBtn">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// Fix mobile viewport height
function setVH() {
  const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  document.documentElement.style.setProperty('--app-height', vh + 'px');
}
setVH();
window.addEventListener('resize', setVH);
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', setVH);
  window.visualViewport.addEventListener('scroll', setVH);
}

(function() {
  'use strict';

  // ── Agent Log Helper ──
  function logExchange(userMessage, agentResponse, intent) {
    try {
      const log = JSON.parse(localStorage.getItem('luthuli_agent_log') || '[]');
      const entry = {
        id: crypto.randomUUID(),
        timestamp: new Date().toISOString(),
        channel: 'staff',
        userMessage: userMessage,
        agentResponse: agentResponse,
        intent: intent || 'fallback',
        feedback: null,
        notes: ''
      };
      log.push(entry);
      localStorage.setItem('luthuli_agent_log', JSON.stringify(log));
      return entry.id;
    } catch(e) { return null; }
  }

  function updateLogFeedback(logId, feedback) {
    try {
      const log = JSON.parse(localStorage.getItem('luthuli_agent_log') || '[]');
      const entry = log.find(e => e.id === logId);
      if (entry) { entry.feedback = feedback; localStorage.setItem('luthuli_agent_log', JSON.stringify(log)); }
    } catch(e) {}
  }

  function addFeedbackRow(logId) {
    const row = document.createElement('div');
    row.className = 'feedback-row';
    const btnGood = document.createElement('button');
    btnGood.className = 'feedback-btn';
    btnGood.textContent = '\uD83D\uDC4D';
    btnGood.title = 'Good response';
    const btnBad = document.createElement('button');
    btnBad.className = 'feedback-btn';
    btnBad.textContent = '\uD83D\uDC4E';
    btnBad.title = 'Bad response';
    btnGood.addEventListener('click', () => { btnGood.classList.add('selected'); btnBad.classList.remove('selected'); updateLogFeedback(logId, 'good'); });
    btnBad.addEventListener('click', () => { btnBad.classList.add('selected'); btnGood.classList.remove('selected'); updateLogFeedback(logId, 'bad'); });
    row.appendChild(btnGood);
    row.appendChild(btnBad);
    return row;
  }

  // ── Intent detection for logging ──
  function detectStaffIntent(msg) {
    const m = msg.toLowerCase();
    if (/schedule|when.*work|shift|roster/.test(m)) return 'my_schedule';
    if (/who.*cover|who.*on|coverage/.test(m)) return 'staff_coverage';
    if (/check.?in|arriving|guest|who.*coming/.test(m)) return 'guest_checkins';
    if (/leave|day off|time off/.test(m)) return 'leave_request';
    if (/room.*ready|cleaned|prepared/.test(m)) return 'room_ready';
    if (/my leave|leave status/.test(m)) return 'leave_status';
    if (/hi|hello|hey|morning|afternoon/.test(m)) return 'greeting';
    return 'fallback';
  }

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const toastEl = document.getElementById('toast');

  // State
  let authState = 'awaiting_name'; // awaiting_name | awaiting_code | authenticated
  let userName = '';
  let authToken = '';
  let verifyCode = '';
  let pendingLeave = null;

  // ── Auto-resize textarea ──
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';
    sendBtn.classList.toggle('active', inputEl.value.trim().length > 0);
  });

  // ── Send handling ──
  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    removeChips();

    addBubble(text, 'user');
    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendBtn.classList.remove('active');

    handleInput(text);
  }

  // ── Toast ──
  function showToast(msg, duration) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), duration || 3000);
  }

  // ── Bubbles ──
  function addBubble(text, sender, extra) {
    const row = document.createElement('div');
    row.className = 'bubble-row ' + sender;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    if (extra) bubble.innerHTML += extra;
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  function addRichBubble(text, htmlContent, sender) {
    const row = document.createElement('div');
    row.className = 'bubble-row ' + (sender || 'agent');
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (text) {
      const p = document.createElement('span');
      p.textContent = text;
      bubble.appendChild(p);
    }
    const container = document.createElement('div');
    container.innerHTML = htmlContent;
    bubble.appendChild(container);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  function addTimestamp(text) {
    const ts = document.createElement('div');
    ts.className = 'timestamp';
    ts.textContent = text;
    messagesEl.appendChild(ts);
  }

  function showTyping() {
    const row = document.createElement('div');
    row.className = 'typing-row';
    row.id = 'typing';
    row.innerHTML = '<div class="typing-bubble"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  function hideTyping() {
    const el = document.getElementById('typing');
    if (el) el.remove();
  }

  function scrollToBottom() {
    requestAnimationFrame(() => {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });
  }

  // ── Suggestion chips ──
  let chipsEl = null;

  function showChips(chipTexts) {
    removeChips();
    const row = document.createElement('div');
    row.className = 'chips';
    chipTexts.forEach(text => {
      const btn = document.createElement('button');
      btn.className = 'chip';
      btn.textContent = text;
      btn.addEventListener('click', () => {
        removeChips();
        addBubble(text, 'user');
        inputEl.value = '';
        inputEl.style.height = 'auto';
        sendBtn.classList.remove('active');
        handleInput(text);
      });
      row.appendChild(btn);
    });
    chipsEl = row;
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  function removeChips() {
    if (chipsEl) { chipsEl.remove(); chipsEl = null; }
  }

  // ── Clear / Restart ──
  window.clearStaffChat = function() {
    messagesEl.innerHTML = '';
    removeChips();
    addBubble('Chat cleared. What do you need?', 'agent');
    setTimeout(() => showChips(['My schedule', "Who's covering?", 'Guest check-ins', 'Request leave', 'Room ready']), 500);
  };
  window.restartStaffChat = function() {
    messagesEl.innerHTML = '';
    removeChips();
    authState = 'awaiting_name';
    userName = '';
    authToken = null;
    verifyCode = '';
    setTimeout(() => addBubble("Hi! I'm the Luthuli staff assistant. What's your name?", 'agent'), 400);
  };

  // ── Delayed agent reply ──
  let _lastUserMsg = '';
  let _lastIntent = 'fallback';

  function agentReply(text, delay, extra) {
    showTyping();
    const userMsg = _lastUserMsg;
    const intent = _lastIntent;
    setTimeout(() => {
      hideTyping();
      if (extra) {
        addRichBubble(text, extra);
      } else {
        addBubble(text, 'agent');
      }
      // Log exchange and add feedback buttons
      const logId = logExchange(userMsg, text || '[rich content]', intent);
      if (logId) {
        const lastRow = messagesEl.querySelector('.bubble-row:last-child, .msg-row:last-child');
        if (lastRow) lastRow.appendChild(addFeedbackRow(logId));
      }
    }, delay || 1200);
  }

  // ── Auth flow + message routing ──
  async function handleInput(text) {
    if (authState === 'awaiting_name') {
      userName = text.trim();
      authState = 'awaiting_code';

      // POST auth
      try {
        const res = await fetch('/api/luthuli/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier: userName, channel: 'staff' })
        });
        const data = await res.json();
        verifyCode = data.demo_code || data.code || '847291';
        showToast('Your code is ' + verifyCode, 4000);
      } catch (e) {
        // Demo fallback
        verifyCode = '847291';
        showToast('Your code is ' + verifyCode, 4000);
      }

      agentReply('Hi ' + userName + "! I've sent a verification code. Please enter it here.", 1000);
      return;
    }

    if (authState === 'awaiting_code') {
      // POST verify
      try {
        await fetch('/api/luthuli/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier: userName, code: text.trim(), channel: 'staff' })
        });
      } catch (e) { /* demo fallback */ }

      authState = 'authenticated';
      agentReply('Welcome back, ' + userName + '! I can help with your schedule, guest check-ins, or leave requests. What do you need?', 1200);
      setTimeout(() => {
        showChips(['My schedule', "Who's covering?", 'Guest check-ins', 'Request leave', 'Room ready']);
      }, 1500);
      return;
    }

    // ── Authenticated: handle capabilities ──
    _lastUserMsg = text;

    if (pendingLeave) {
      _lastIntent = 'leave_confirm';
      handleLeaveConfirm(text);
      return;
    }

    const lower = text.toLowerCase();
    _lastIntent = detectStaffIntent(text);

    if (lower.includes('schedule') || lower.includes('work next') || lower.includes('when do i work') || lower.includes('roster')) {
      handleSchedule();
    } else if (lower.includes('check') && (lower.includes('in') || lower.includes('out')) || lower.includes('booking') || lower.includes('guest') || lower.includes('arriving')) {
      handleBookings();
    } else if (lower.includes('leave') || lower.includes('day off') || lower.includes('take off')) {
      handleLeaveRequest(text);
    } else if (lower.includes('ready') || lower.includes('done') || lower.includes('cleaned') || lower.includes('prepared')) {
      handleRoomReady(text);
    } else {
      handleGeneral(text);
    }
  }

  // ── Schedule card ──
  function handleSchedule() {
    const days = getNext7Days();
    let stripHTML = '<div class="schedule-card"><div class="schedule-card-title">Your Schedule</div><div class="schedule-strip">';

    days.forEach(d => {
      stripHTML += '<div class="schedule-day ' + d.type + '">' +
        '<div class="schedule-day-label">' + d.day + '</div>' +
        '<div class="schedule-day-num">' + d.num + '</div>' +
        '<div class="schedule-day-status">' + d.status + '</div>' +
        '</div>';
    });

    stripHTML += '</div></div>';
    agentReply("Here's your upcoming schedule:", 1400, stripHTML);
  }

  function getNext7Days() {
    const types = ['work', 'work', 'off', 'work', 'work', 'work', 'sunday'];
    const statuses = ['On', 'On', 'Off', 'On', 'On', 'On', 'Sun'];
    const dayNames = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    const result = [];
    const now = new Date();

    for (let i = 0; i < 7; i++) {
      const d = new Date(now);
      d.setDate(d.getDate() + i);
      const dow = d.getDay();
      let type, status;

      if (dow === 0) { type = 'sunday'; status = 'Sun'; }
      else if (dow === 3) { type = 'off'; status = 'Off'; }
      else { type = 'work'; status = 'On'; }

      result.push({
        day: dayNames[dow === 0 ? 6 : dow - 1],
        num: d.getDate(),
        type: type,
        status: status
      });
    }
    return result;
  }

  // ── Bookings ──
  function handleBookings() {
    const html = '<div class="booking-card">' +
      '<div class="booking-guest">Van der Merwe Family</div>' +
      '<div class="booking-detail">Room 3 &middot; 2 adults, 1 child</div>' +
      '<div class="booking-detail">Arriving ~14:00</div>' +
      '<div class="booking-badge checkin">Check-in</div>' +
      '</div>' +
      '<div class="booking-card">' +
      '<div class="booking-guest">J. Thompson</div>' +
      '<div class="booking-detail">Room 1 &middot; 2 adults</div>' +
      '<div class="booking-detail">Departing ~10:00</div>' +
      '<div class="booking-badge checkout">Check-out</div>' +
      '</div>';

    agentReply("Tomorrow's guest movements:", 1400, html);
  }

  // ── Leave request ──
  function handleLeaveRequest(text) {
    // Try to parse dates from message
    const dateMatch = text.match(/(\d{1,2})\s*[-–to]+\s*(\d{1,2})\s*(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)?/i);
    let dateStr = '12-16 May';
    if (dateMatch) {
      dateStr = dateMatch[0];
    }

    pendingLeave = dateStr;

    const html = '<div class="leave-actions">' +
      '<button class="leave-btn confirm" onclick="window._confirmLeave()">Submit Request</button>' +
      '<button class="leave-btn cancel" onclick="window._cancelLeave()">Cancel</button>' +
      '</div>';

    agentReply('Leave request for ' + dateStr + '. That\'s ' + getDayCount(dateStr) + ' working days. Shall I submit this to management?', 1200, html);
  }

  function getDayCount(str) {
    const match = str.match(/(\d{1,2})\s*[-–to]+\s*(\d{1,2})/);
    if (match) return Math.max(1, parseInt(match[2]) - parseInt(match[1]) + 1);
    return 3;
  }

  window._confirmLeave = function() {
    document.querySelectorAll('.leave-actions').forEach(el => {
      el.innerHTML = '<span style="color:var(--ios-blue);font-weight:600;font-size:14px;">Submitted</span>';
    });
    addBubble('Yes, submit it', 'user');
    pendingLeave = null;

    const html = '<div class="confirm-card">' +
      '<div class="confirm-icon">&#9989;</div>' +
      '<div class="confirm-text">Leave request submitted. Management will be notified. You\'ll get a confirmation once approved.</div>' +
      '</div>';

    agentReply('', 1000, html);
  };

  window._cancelLeave = function() {
    document.querySelectorAll('.leave-actions').forEach(el => {
      el.innerHTML = '<span style="color:var(--ios-text-secondary);font-size:14px;">Cancelled</span>';
    });
    addBubble('Cancel', 'user');
    pendingLeave = null;
    agentReply('No problem, leave request cancelled. Let me know if you need anything else.', 1000);
  };

  function handleLeaveConfirm(text) {
    const lower = text.toLowerCase();
    if (lower.includes('yes') || lower.includes('submit') || lower.includes('confirm')) {
      window._confirmLeave();
    } else {
      window._cancelLeave();
    }
  }

  // ── Room ready ──
  function handleRoomReady(text) {
    const roomMatch = text.match(/room\s*(\d+)/i);
    const room = roomMatch ? roomMatch[1] : '2';

    const html = '<div class="confirm-card">' +
      '<div class="confirm-icon">&#9989;</div>' +
      '<div class="confirm-text">Room ' + room + ' marked as ready. Reception has been notified.</div>' +
      '</div>';

    agentReply('', 1000, html);
  }

  // ── Client-side fallback when API unavailable ──
  function staffFallback(msg) {
    const m = msg.toLowerCase();
    if (/schedule|when.*work|shift|roster/.test(m)) return '**Your Schedule (next 7 days):**\n\n7 Apr: ON\n8 Apr: ON\n9 Apr: ON\n10 Apr: ON\n11 Apr: ON\n12 Apr: ON\n13 Apr: OFF (Sunday)\n\nYou\'re on day 7 of your 21-day cycle. Next break starts 22 Apr.';
    if (/who.*cover|who.*on|coverage/.test(m)) return '**Coverage Today:**\n\n- Nomsa: ON\n- Thandiwe: OFF (break day 3)\n\nSingle coverage today.';
    if (/check.?in|arriving|guest|who.*coming/.test(m)) return '**Upcoming Check-ins:**\n\n- Van der Merwe arrives 6 Apr (2 adults) — Bush Pavilion\n- Ndlovu & Party arrives 12 Apr (4 adults) — Sunset Pavilion';
    if (/leave|day off|time off/.test(m)) return 'Sure, let\'s request time off. What start and end dates do you need? (e.g. 10-14 May)';
    if (/room.*ready|cleaned|prepared/.test(m)) return '✓ Room status logged. The manager has been notified.';
    if (/my leave|leave status/.test(m)) return 'You have no pending leave requests. Would you like to request time off?';
    return 'I can help with:\n- **My schedule** — see your rotation\n- **Who\'s covering** — check staff\n- **Guest check-ins** — upcoming arrivals\n- **Room status** — log readiness\n- **Leave** — request or check time off';
  }

  // ── General chat (via API with fallback) ──
  async function handleGeneral(text) {
    showTyping();
    try {
      const res = await fetch('/api/luthuli/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          ...(authToken ? { 'Authorization': 'Bearer ' + authToken } : {})
        },
        body: JSON.stringify({ message: text, channel: 'staff' })
      });
      if (!res.ok) throw new Error('API ' + res.status);
      const data = await res.json();
      hideTyping();
      const reply = data.reply || data.message || staffFallback(text);
      addBubble(reply, 'agent');
      const logId = logExchange(text, reply, data.intent || _lastIntent);
      if (logId) {
        const lastRow = messagesEl.querySelector('.bubble-row:last-child');
        if (lastRow) lastRow.appendChild(addFeedbackRow(logId));
      }
    } catch (e) {
      hideTyping();
      const reply = staffFallback(text);
      addBubble(reply, 'agent');
      const logId = logExchange(text, reply, _lastIntent);
      if (logId) {
        const lastRow = messagesEl.querySelector('.bubble-row:last-child');
        if (lastRow) lastRow.appendChild(addFeedbackRow(logId));
      }
    }
  }

  // ── Init ──
  function init() {
    const now = new Date();
    const hours = now.getHours();
    const mins = now.getMinutes().toString().padStart(2, '0');
    const ampm = hours >= 12 ? 'PM' : 'AM';
    const h12 = hours % 12 || 12;
    addTimestamp('Today ' + h12 + ':' + mins + ' ' + ampm);

    setTimeout(() => {
      addBubble("Hi! I'm the Luthuli staff assistant. What's your name?", 'agent');
    }, 500);
  }

  init();

  // ── Keyboard handling: scroll into view on focus ──
  inputEl.addEventListener('focus', () => {
    setTimeout(scrollToBottom, 300);
  });

  // Virtual keyboard scroll handled by global setVH
})();
</script>
