<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — 2nth.ai Developer Portal</title>
  <link rel="icon" type="image/svg+xml" href="https://2nth.ai/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --c-carbon:#0a0a0a; --c-graphite:#141414; --c-titanium:#fafafa;
      --c-steel-400:#c4c4cc; --c-steel-600:#71717a; --c-steel-700:#52525b;
      --c-border:hsla(0,0%,100%,.06); --c-input-bg:#141414;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Barlow', sans-serif;
      background: var(--c-carbon); color: var(--c-steel-600);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .wrap { max-width: 420px; width: 100%; padding: 24px; text-align: center; }
    .logo { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 0.06em; color: var(--c-titanium); text-decoration: none; }
    .logo span { color: #06B6D4; }
    .subtitle { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--c-steel-600); margin-top: 2px; margin-bottom: 32px; }
    .card { background: var(--c-graphite); border: 1px solid var(--c-border); border-radius: 8px; padding: 36px 32px; text-align: left; }
    .label { display: block; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--c-steel-600); margin-bottom: 8px; font-weight: 600; }
    .input {
      width: 100%; padding: 12px 14px; border: 1px solid var(--c-border); border-radius: 4px;
      background: var(--c-input-bg); color: var(--c-titanium);
      font-family: 'JetBrains Mono', monospace; font-size: 14px; outline: none;
      transition: border-color 0.15s;
    }
    .input::placeholder { color: var(--c-steel-700); }
    .input:focus { border-color: #06B6D4; }
    .input-code {
      font-size: 28px; letter-spacing: 0.3em; text-align: center; margin-top: 8px;
    }
    .btn {
      width: 100%; margin-top: 12px; padding: 12px; border: 1px solid #06B6D4; border-radius: 4px;
      background: #06B6D4; color: #0a0a0a; cursor: pointer;
      font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase;
      transition: background 0.15s;
    }
    .btn:hover { background: #0891b2; border-color: #0891b2; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-ghost {
      width: 100%; margin-top: 8px; padding: 12px; border: 1px solid var(--c-border); border-radius: 4px;
      background: transparent; color: var(--c-steel-400); cursor: pointer;
      font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase;
      transition: all 0.15s;
    }
    .btn-ghost:hover { border-color: #06B6D4; color: #06B6D4; }
    .code-step { display: none; margin-top: 20px; }
    .code-step.show { display: block; }
    .code-hint { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--c-steel-700); margin-top: 10px; text-align: center; }
    .divider {
      display: flex; align-items: center; gap: 12px; margin: 20px 0;
      font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 2px;
      text-transform: uppercase; color: var(--c-steel-700);
    }
    .divider::before, .divider::after { content: ''; flex: 1; border-top: 1px solid var(--c-border); }
    .alt-btn {
      width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px; border: 1px solid var(--c-border); border-radius: 4px;
      background: var(--c-carbon); color: var(--c-steel-400); text-decoration: none;
      font-family: 'JetBrains Mono', monospace; font-size: 11px; transition: all 0.15s; cursor: pointer;
    }
    .alt-btn:hover { border-color: #06B6D4; color: #06B6D4; }
    .msg { font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 8px 12px; border-radius: 4px; margin-bottom: 12px; display: none; }
    .msg.show { display: block; }
    .msg-err { background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.2); color: #EF4444; }
    .msg-ok { background: rgba(6,182,212,.08); border: 1px solid rgba(6,182,212,.2); color: #06B6D4; }
    .features { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-top: 28px; }
    .feat { display: flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--c-steel-600); }
    .dot { width: 5px; height: 5px; border-radius: 50%; background: #06B6D4; }
    .links { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin-top: 20px; }
    .links a { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--c-steel-600); text-decoration: none; transition: color 0.15s; }
    .links a:hover { color: #06B6D4; }
    .footer { margin-top: 40px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--c-steel-700); }
    .footer a { color: #06B6D4; text-decoration: none; }
  </style>
</head>
<body>
<div class="wrap">
  <a href="https://2nth.ai" class="logo"><span>2</span>NTH</a>
  <div class="subtitle">Developer &amp; Partner Portal</div>

  <div class="card">
    <div id="msg" class="msg"></div>

    <div id="emailStep">
      <label class="label">Sign in with your email</label>
      <input type="email" id="email" class="input" placeholder="you@company.com">
      <button type="button" class="btn" onclick="sendCode()">Send sign-in code</button>
    </div>

    <div class="code-step" id="codeStep">
      <label class="label">Enter your 6-digit code</label>
      <input type="text" id="code" class="input input-code" placeholder="000000" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
      <button type="button" class="btn" id="verifyBtn" onclick="verifyCode()">Verify code</button>
      <button type="button" class="btn-ghost" onclick="resendCode()">Resend code</button>
      <div class="code-hint">Check your inbox — code expires in 10 minutes.</div>
    </div>

  </div>

  <div class="features">
    <div class="feat"><div class="dot"></div>300+ AI Skills</div>
    <div class="feat"><div class="dot"></div>Partner Hubs</div>
    <div class="feat"><div class="dot"></div>Revenue Sharing</div>
    <div class="feat"><div class="dot"></div>Token Billing</div>
  </div>

  <div class="links">
    <a href="/docs.html">Docs</a>
    <a href="/portal.html">Portal</a>
  </div>

  <div class="footer"><a href="https://2nth.ai">2nth.ai</a> — from thought to motion</div>
</div>

<script>
let currentEmail = '';

// Already signed in? Redirect to portal.
fetch('/api/auth/session', { credentials: 'include' })
  .then(r => r.json())
  .then(d => { if (d.user) window.location.href = '/portal.html'; })
  .catch(() => {});

function showMsg(text, type) {
  var msg = document.getElementById('msg');
  msg.className = 'msg show msg-' + type;
  msg.textContent = text;
}

function clearMsg() {
  var msg = document.getElementById('msg');
  msg.className = 'msg';
  msg.textContent = '';
}

async function sendCode() {
  clearMsg();
  var email = document.getElementById('email').value.trim().toLowerCase();
  if (!email || !email.includes('@')) {
    showMsg('Enter a valid email address.', 'err');
    return;
  }

  try {
    var res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    var data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || 'Failed to send');

    currentEmail = email;
    document.getElementById('emailStep').style.display = 'none';
    var codeStep = document.getElementById('codeStep');
    codeStep.classList.add('show');
    showMsg('Code sent — check your inbox.', 'ok');
    document.getElementById('code').focus();
  } catch (e) {
    showMsg(e.message, 'err');
  }
}

async function verifyCode() {
  clearMsg();
  var code = document.getElementById('code').value.trim();
  if (code.length !== 6) {
    showMsg('Enter the 6-digit code from your email.', 'err');
    return;
  }

  var btn = document.getElementById('verifyBtn');
  btn.disabled = true;
  btn.textContent = 'Verifying…';

  try {
    var res = await fetch('/api/auth/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: currentEmail, code }),
    });
    var data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || 'Invalid code');

    window.location.href = '/portal.html';
  } catch (e) {
    showMsg(e.message, 'err');
    btn.disabled = false;
    btn.textContent = 'Verify code';
  }
}

async function resendCode() {
  clearMsg();
  try {
    await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: currentEmail }),
    });
    showMsg('New code sent.', 'ok');
    document.getElementById('code').value = '';
    document.getElementById('code').focus();
  } catch {}
}

document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('email').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') sendCode();
  });
  document.getElementById('code').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') verifyCode();
  });
});
</script>
</body>
</html>
